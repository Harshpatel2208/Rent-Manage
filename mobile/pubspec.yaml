name: mobile
description: Multi-Tenant Mobile Money Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  connectivity_plus: ^6.0.3
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  pdf: ^3.11.1
  csv: ^6.0.0
  decimal: ^2.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  path: ^1.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
